# golangci-lint v2 configuration. The depguard rules carry the licence policy
# of DESIGN §3.1 and §3.3; go-licenses check in CI is the second gate.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - misspell
  settings:
    depguard:
      rules:
        no-qrysm:
          files:
            - $all
          deny:
            - pkg: github.com/theQRL/qrysm
              desc: qrysm is GPL-3.0; re-implement from the specs or use tools/vectorgen (DESIGN §3.3)
        go-qrl-only-in-execution:
          files:
            - $all
            - "!**/internal/execution/**"
          deny:
            # "$" makes the first entry an exact match, so go-qrllib (MIT) is not caught.
            - pkg: github.com/theQRL/go-qrl$
              desc: go-qrl is LGPL-3.0; import it only under internal/execution (DESIGN §3.1)
            - pkg: github.com/theQRL/go-qrl/
              desc: go-qrl is LGPL-3.0; import it only under internal/execution (DESIGN §3.1)
        no-go-qrl-gpl:
          files:
            - $all
          deny:
            - pkg: github.com/theQRL/go-qrl/cmd
              desc: go-qrl cmd/** is GPL-3.0 (DESIGN §3.3)
            - pkg: github.com/theQRL/go-qrl/internal
              desc: go-qrl internal/** is GPL-3.0 (DESIGN §3.3)

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rgeraldes24/go-remotesigner
