  /api/v1/consensus/randao_reveal/{identifier}:
    post:
      tags: [RANDAO]
      operationId: randaoReveal
      summary: Release the RANDAO hash-onion pre-image of the given commitment
      description: |
        The signer holds the 48-byte seed. Onion: x_0 = SHA-256("qrl-randao-onion-v1" || seed48),
        x_{j+1} = SHA-256(x_j), commitment x_L (L = 2^20 by default). Returns `randao_reveal` with
        SHA-256(randao_reveal) == randao_commitment.

        Frontier rule (docs/contract.md, "RANDAO reveal"), with per-key state (m, R = x_m, last). Every release
        that moves the frontier ("new-layer conditions") requires: genesis time known and
        `slot ∈ [now_slot - 1, now_slot + skew]` (else 412 `RANDAO_SLOT_OUT_OF_WINDOW`); `slot > last`
        (else 412 `RANDAO_SLOT_NOT_INCREASING`); a token in the key's new-layer bucket, default burst 3 and
        one per epoch (else 412 `RANDAO_NEW_LAYER_RATE_LIMITED`); the state compare-and-set committed before
        the response.
        - first use (no state): scan from x_0 (rate-limited, else 429); new-layer conditions; release.
        - commitment reachable forward from R in 1..W steps, or further (slow path): re-reveal, no state change.
        - commitment == R: a new layer; new-layer conditions; release x_{m-1}.
        - commitment deeper than anything this signer released: the frontier advances to it under the same
          new-layer conditions (one layer per slot, bucket applies) and a WARN is logged. It is never refused
          merely for being deeper.
        - not in this onion: 422 `RANDAO_UNKNOWN_COMMITMENT`.

        New layers require the signer to know the genesis time. The client must verify
        SHA-256(reveal) == commitment before calling GetBeaconBlock. Body limit 4 KiB.
      security:
        - signToken: []
      parameters:
        - $ref: '#/components/parameters/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RandaoRevealRequest'
            example:
              slot: "62"
              randao_commitment: "0xe17fb348371196a90df0e5fb286257f29c006b4527cd838dc9a2eee4e41e1ffe"
              fork_info:
                fork:
                  previous_version: "0x000000fd"
                  current_version: "0x000000fd"
                  epoch: "0"
                genesis_validators_root: "0x7a1e2c4d5b6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809"
      responses:
        '200':
          description: Reveal released (first use, new layer, gap advance or re-reveal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandaoRevealResponse'
              example:
                randao_reveal: "0xf26304fe9b11cac1b460aef64aaf7bb11df4b1fcdee6ddb00a69fee0a80d97df"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/consensus/randao_state/{identifier}:
    delete:
      tags: [RANDAO]
      operationId: resetRandaoState
      summary: Clear the stored RANDAO frontier for one key (admin, online)
      description: |
        Operational cleanup; no correctness path depends on it. Works online for both the bbolt and the
        Postgres backend. The key's next reveal is a first use and is subject to the new-layer conditions.
        Returns 200 also when no state existed. 404 when the key is unknown or slashing protection is
        disabled. The offline equivalent is `remotesigner consensus randao-state reset --key`.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/Identifier'
      responses:
        '200':
          description: State cleared (or there was none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
              example: {code: 200, message: randao state cleared}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrProtectionDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/consensus/publicKeys:
    get:
      tags: [Public Key]
      operationId: getPublicKeys
