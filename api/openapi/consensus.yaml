openapi: 3.0.3
info:
  title: QRL Remote Signer API
  version: 1.0.0
  description: |
    Remote-signing contract between the qrysm validator client (its `remote-web3signer` keymanager) and
    go-remotesigner (binary `remotesigner`), a Go port of Consensys Web3Signer for the QRL stack. The prose
    contract, including the error catalogue, the RANDAO frontier rule and the capabilities checks, is
    `docs/contract.md`.

    Derived from ethereum/remote-signing-api v1.4.0 (CC0-1.0) and Web3Signer (Apache-2.0), adapted for QRL:
    ML-DSA-87 (2,592-byte public keys, 4,627-byte signatures), per-participant `signatures` lists,
    64-byte `Q` addresses, a single fork ("ZOND"), and a hash-onion RANDAO reveal endpoint.

    Frozen at 1.0.0. Any change to a request or response shape needs a version bump (strict JSON makes even an
    added field breaking), regenerated golden vectors and the matching qrysm client change.

    Encoding rules, enforced strictly by the signer:
    - uint64 values are decimal strings from "0" to "18446744073709551615". JSON numbers are rejected.
    - Fixed-size bytes are `0x` + hex of the exact length. Input may use either case; output is lowercase.
    - Unknown JSON fields and duplicate keys are rejected (400 `UNKNOWN_FIELD` / `MALFORMED_JSON`).
    - `type` is an exact upper-case enum.
    - 64-byte addresses use `Q` + 128 hex. The checksum is not enforced.

    Signing context: every signature is ML-DSA-87 over the 32-byte signing root via the go-qrllib wallet API,
    with FIPS 204 context "ZOND" || 0x01 || descriptor (5a4f4e4401010000).

    Examples are schema-valid but are not golden vectors: public keys and signatures are fixed byte patterns
    (0xa5 and 0x5a repeated), and signing roots are placeholders, not recomputed from the objects, except in the
    AGGREGATION_SLOT example, whose root is the worked example of docs/spec/signing-roots.md section 4. The
    RANDAO example uses interop key 0's real commitment and first reveal (docs/spec/randao-onion.md, vector V4).
    Milestone S3 replaces the signing examples with generated golden vectors.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://127.0.0.1:9000
    description: Default loopback listener
tags:
  - name: Signing
    description: Consensus signing for the nine qrysm duty types
  - name: RANDAO
    description: Hash-onion RANDAO reveal (QRL-specific)
  - name: Public Key
  - name: Server Status
  - name: Reload
  - name: Slashing Protection
  - name: Keymanager
    description: Keymanager API subset. Only present with `--key-manager-api-enabled`. Admin token required.

security:
  - signToken: []

paths:
  /api/v1/consensus/sign/{identifier}:
    post:
      tags: [Signing]
      operationId: sign
      summary: Sign a consensus artifact with the key identified by `identifier`
      description: |
        Pipeline (docs/contract.md, "Validation pipeline"): auth → content type → body limit → identifier
        precheck → strict decode → type policy → invariants → recompute the signing root (compare the optional
        `signing_root`) → `fork_info` check → clock bound → key lookup → slashing check-and-record (BLOCK_V2,
        ATTESTATION) → sign → verify → respond.

        The signer derives every domain from its own network configuration. Body limit 2 MiB.
        `AGGREGATION_SLOT` and `SYNC_COMMITTEE_SELECTION_PROOF` are signed deterministically by default,
        all other types hedged.

        Content negotiation: the response is `application/json` unless the `Accept` header lists `text/plain`
        and does not list `application/json`; only then is the bare signature returned as `text/plain`. q-values
        do not change this. No `Accept` header means JSON.
      security:
        - signToken: []
      parameters:
        - $ref: '#/components/parameters/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
            examples:
              BLOCK_V2:
                $ref: '#/components/examples/BlockV2'
              ATTESTATION:
                $ref: '#/components/examples/Attestation'
              AGGREGATION_SLOT:
                $ref: '#/components/examples/AggregationSlot'
              AGGREGATE_AND_PROOF:
                $ref: '#/components/examples/AggregateAndProof'
              VOLUNTARY_EXIT:
                $ref: '#/components/examples/VoluntaryExit'
              SYNC_COMMITTEE_MESSAGE:
                $ref: '#/components/examples/SyncCommitteeMessage'
              SYNC_COMMITTEE_SELECTION_PROOF:
                $ref: '#/components/examples/SyncCommitteeSelectionProof'
              SYNC_COMMITTEE_CONTRIBUTION_AND_PROOF:
                $ref: '#/components/examples/SyncCommitteeContributionAndProof'
              VALIDATOR_REGISTRATION:
                $ref: '#/components/examples/ValidatorRegistration'
      responses:
        '200':
          description: Signature over the signing root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResponse'
              example:
                signature: &signature "0x5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a\
