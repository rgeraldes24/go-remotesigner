        signing_root: "0x58ef945f45172db2a6d5a9fb80f828a8f2bbe72824eb60097595d0603323c049"
        sync_committee_message:
          beacon_block_root: "0x44dd55ee66ff778899001122334455667788990011aabbccddeeff0011223344"
          slot: "61"
    SyncCommitteeSelectionProof:
      summary: SYNC_COMMITTEE_SELECTION_PROOF (deterministic)
      value:
        type: SYNC_COMMITTEE_SELECTION_PROOF
        fork_info:
          fork: {previous_version: "0x000000fd", current_version: "0x000000fd", epoch: "0"}
          genesis_validators_root: "0x9471e8fb19e0faae953e9d46889f207192bcec9b14293d7ba418ae4dc5e3ac8f"
        signing_root: "0x9fb9c4eb8f9d9c58a3b43245f5fd32e75e80ca77758cc80a022749e2fcc8d9f6"
        sync_aggregator_selection_data: {slot: "61", subcommittee_index: "0"}
    SyncCommitteeContributionAndProof:
      summary: SYNC_COMMITTEE_CONTRIBUTION_AND_PROOF (minimal preset, 2-byte bitvector, 2 participants)
      value:
        type: SYNC_COMMITTEE_CONTRIBUTION_AND_PROOF
        fork_info:
          fork: {previous_version: "0x000000fd", current_version: "0x000000fd", epoch: "0"}
