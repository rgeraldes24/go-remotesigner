# Publishes a release when a version tag (v*) is pushed on a commit of main,
# and at no other time. The tagged tree first goes through the compliance
# gates, its CHANGELOG.md entry (which must be dated) becomes the release
# notes, and the release dry run and its checks run, built from a cold Go
# cache; only then does goreleaser publish both flavours (.goreleaser.yaml):
# the archives with an SBOM each, checksums.txt with a keyless cosign
# signature, a build provenance attestation over the checksums, and the
# multi-platform images on ghcr.io with their SBOM and provenance
# attestations, signed with cosign. docs/operations/release.md explains how
# to verify them.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; the release job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  # renovate: datasource=go depName=github.com/goreleaser/goreleaser/v2
  GORELEASER_VERSION: v2.18.2
  # renovate: datasource=go depName=github.com/google/go-licenses/v2
  GO_LICENSES_VERSION: v2.0.1
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.52.0
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release and upload its files
      packages: write # push the images to ghcr.io
      id-token: write # the OIDC token for keyless cosign signing and the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch and tag: goreleaser reads the tags and the history for
          # the changelog, and the next step reads origin/main.
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} tags $(git rev-parse HEAD), which is not on main; releases are cut from main only" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # The release is built from a cold module and build cache, never from
          # one an earlier workflow run saved.
          cache: false
      - name: Install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
      - name: Compliance gates (as in CI)
        run: |
          make license-hash headercheck nogpl licenses GO_LICENSES="$(go env GOPATH)/bin/go-licenses"
          go vet ./...
          go vet -tags noexecution ./...
      - name: Release notes from the tag's CHANGELOG.md entry (dated, except for a pre-release)
        run: go run ./tools/releasedocs -notes "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Release dry run and checks (nothing is published yet)
        run: |
          make release-snapshot GORELEASER=goreleaser GO_LICENSES="$(go env GOPATH)/bin/go-licenses"
          make release-check
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GO_LICENSES="$(go env GOPATH)/bin/go-licenses" goreleaser release --clean --release-notes "${RUNNER_TEMP}/release-notes.md"
      - name: Build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
