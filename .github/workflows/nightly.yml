# Long-running checks that do not fit a PR run.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  b19:
    name: B19 idle-connection race (1 h)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: B19 (0 connection errors over 1 h with IdleTimeout 120 s)
        run: make b19 B19_DURATION=1h

  fuzz-keystore:
    name: Keystore decoder fuzz (30 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: FuzzDecrypt (never panics, typed refusals, bounded allocation)
        run: make fuzz-keystore FUZZTIME=30m
      - name: Print the failing inputs
        if: failure()
        run: |
          dir=internal/keys/keystore/qrlv1/testdata/fuzz
          if [ -d "$dir" ]; then find "$dir" -type f -print -exec cat {} \; ; fi

  fuzz-interchange:
    name: EIP-3076 interchange fuzz (30 min, G4 S35)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Fuzz the interchange import and export
        run: make fuzz-interchange FUZZTIME=30m
