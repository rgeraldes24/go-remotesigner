name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test exactly the Go release the matrix selects instead of switching to
  # the go.mod toolchain line.
  GOTOOLCHAIN: local
  # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
  GOLANGCI_LINT_VERSION: v2.14.0
  # renovate: datasource=go depName=github.com/google/go-licenses/v2
  GO_LICENSES_VERSION: v2.0.1
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Build both flavours (static)
        run: make build build-consensus
      - name: Print version
        run: |
          ./bin/remotesigner --version
          ./bin/remotesigner-consensus --version
      - name: go vet
        run: |
          go vet ./...
          go vet -tags noexecution ./...
      - name: go test -race
        # The race detector needs cgo; everything else in this job builds with CGO_ENABLED=0.
        run: make test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: golangci-lint (default flavour, includes depguard)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint (consensus flavour)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags noexecution

  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: LICENSE is the verbatim Apache-2.0 text
        run: make license-hash
      - name: NOTICE has no LGPL paragraph
        # The consensus flavour never links go-qrl; its NOTICE must not claim it does (DESIGN §6.1).
        run: |
          if grep -nEi 'LGPL|Lesser General Public' NOTICE; then
            echo "NOTICE must not carry the go-qrl LGPL paragraph" >&2
            exit 1
          fi
      - name: headercheck
        run: make headercheck
      - name: go-licenses check
        run: |
          go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          make licenses GO_LICENSES="$(go env GOPATH)/bin/go-licenses"
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          make vuln GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
