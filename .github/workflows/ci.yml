name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test exactly the Go release the matrix selects instead of switching to
  # the go.mod toolchain line.
  GOTOOLCHAIN: local
  # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
  GOLANGCI_LINT_VERSION: v2.14.0
  # renovate: datasource=go depName=github.com/google/go-licenses/v2
  GO_LICENSES_VERSION: v2.0.1
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0
  # renovate: datasource=go depName=github.com/goreleaser/goreleaser/v2
  GORELEASER_VERSION: v2.18.2
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.52.0

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.arch }}${{ matrix.arch == 'arm64' && github.event.repository.private && ', cross' || '' }})
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # The free ubuntu-24.04-arm runner may not be offered to private
    # repositories. While the repository is private, the arm64 legs run on
    # amd64: they cross-build and vet for arm64 and skip the native steps.
    runs-on: ${{ matrix.arch == 'arm64' && github.event.repository.private && 'ubuntu-24.04' || matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GOARCH: ${{ matrix.arch }}
      CROSS: ${{ matrix.arch == 'arm64' && github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Build both flavours (static)
        run: make build build-consensus
      - name: Print version
        if: env.CROSS != 'true'
        run: |
          ./bin/remotesigner --version
          ./bin/remotesigner-consensus --version
      - name: go vet
        run: |
          go vet ./...
          go vet -tags noexecution ./...
      - name: go test -race
        if: env.CROSS != 'true'
        # The race detector needs cgo; everything else in this job builds with CGO_ENABLED=0.
        run: make test
      - name: Fuzz (differential hash-tree-root against fastssz, strict decoders, keystore decoder, interchange; 10 s each)
        if: env.CROSS != 'true'
        run: make fuzz

  test-postgres:
    # The Postgres store's tests, which the test job skips: pgstore and the suites that run on it, the runner and the
    # CLI with the race detector, and the built binary's replica tests, against a postgres service with the default
    # max_connections of 100.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      REMOTESIGNER_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Postgres tests
        run: make test-postgres

  cloud-secrets:
    # The secret-store clients and the built binary against a real HashiCorp
    # Vault dev server and LocalStack's Secrets Manager, run as service
    # containers (make test-cloud). GCP Secret Manager and Azure Key Vault
    # have no emulator here: the test job runs their clients against
    # in-process fakes of their wire protocols. LocalStack 4.14.0 is the last
    # release that serves Secrets Manager without an auth token.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      vault:
        image: hashicorp/vault:2.1.2@sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
        env:
          VAULT_DEV_ROOT_TOKEN_ID: remotesigner-ci-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 127.0.0.1:8200:8200
      localstack:
        image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: secretsmanager
        ports:
          - 127.0.0.1:4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      REMOTESIGNER_TEST_VAULT_ADDR: http://127.0.0.1:8200
      REMOTESIGNER_TEST_VAULT_TOKEN: remotesigner-ci-root
      REMOTESIGNER_TEST_AWS_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Wait for Vault
        run: |
          for i in $(seq 60); do
            curl -sf "$REMOTESIGNER_TEST_VAULT_ADDR/v1/sys/health" >/dev/null && exit 0
            sleep 1
          done
          echo "Vault did not start" >&2
          exit 1
      - name: Secret-store clients and the built binary against Vault and LocalStack
        run: make test-cloud

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: golangci-lint (default flavour, includes depguard)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint (consensus flavour)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags noexecution

  vectors:
    # tools/vectorgen links qrysm (GPL-3.0); it runs here and is never shipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            tools/vectorgen/go.sum
            tools/vectorgen/contract/go.sum
      - name: vectorgen and vectorgen contract vet and tests (include the replace checks)
        run: make vectors-test
      - name: Regenerate the golden vectors and embedded networks
        run: make vectors
      - name: Fail on any difference
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: The signer module links no qrysm package
        run: make nogpl

  vectors-verify:
    # Cross-verification: the built signer, loaded with the
    # interop keys, against `vectorgen verify` on both end-to-end networks.
    # Two passes per network: protection disabled and no genesis time (every
    # sign fixture), then protection on with genesis time (RANDAO). Then
    # qrysm's interchange export goes through the signer's import and export
    # and back into qrysm (`vectorgen interchange-check`).
    # tools/vectorgen links qrysm (GPL-3.0); it runs here and is never shipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            tools/vectorgen/go.sum
      - name: Build the signer (static)
        run: make build
      - name: vectorgen verify and the interchange round trip against the built signer
        env:
          REMOTESIGNER_BINARY: ${{ github.workspace }}/bin/remotesigner
        run: make vectors-verify-binary

  vectors-contract:
    # Contract check: qrysm's own remote-web3signer keymanager, at the
    # commit tools/vectorgen/contract pins, drives the built signer
    # (interop keys, both end-to-end networks): capabilities, publicKeys, one
    # sign request per SignRequest oneof and one RANDAO reveal, each answer
    # checked with qrysm's verifiers. Then a DTO renamed on either side must
    # fail it. tools/vectorgen/contract links qrysm (GPL-3.0); it runs here
    # and is never shipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            tools/vectorgen/contract/go.sum
      - name: Build the signer (static)
        run: make build
      - name: vectorgen contract against the built signer
        env:
          REMOTESIGNER_BINARY: ${{ github.workspace }}/bin/remotesigner
        run: make vectors-contract

  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: LICENSE is the verbatim Apache-2.0 text
        run: make license-hash
      - name: NOTICE has no LGPL paragraph
        # The consensus flavour never links go-qrl; its NOTICE must not claim it does.
        run: |
          if grep -nEi 'LGPL|Lesser General Public' NOTICE; then
            echo "NOTICE must not carry the go-qrl LGPL paragraph" >&2
            exit 1
          fi
      - name: headercheck
        run: make headercheck
      - name: contract (OpenAPI spec, examples, docs/contract.md)
        run: make contract
      - name: docs/reference/flags.md is current (tools/flagdoc)
        run: go run ./tools/flagdoc -check
      - name: go-licenses check
        run: |
          go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          make licenses GO_LICENSES="$(go env GOPATH)/bin/go-licenses"
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          make vuln GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"

  release-dry-run:
    # The release dry run (.goreleaser.yaml): every archive, SBOM and image of
    # both flavours, published and signed nowhere; then the release checks
    # (test/release): licence files per flavour in every archive and image,
    # no go-qrl in the consensus binaries, nonroot images, and the Docker
    # smoke test on the amd64 image of each flavour, so the release images
    # themselves run the signer hardened.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Release dry run
        run: make release-snapshot GORELEASER=goreleaser GO_LICENSES="$(go env GOPATH)/bin/go-licenses"
      - name: Release checks
        run: make release-check

  docker-smoke:
    # The image's real entrypoint in Docker, per flavour: a client container
    # reaches https://signer:9000 by name, pinning the generated certificate
    # by its logged fingerprint; the refusals; the compose example.
    name: docker smoke (${{ matrix.flavour }})
    strategy:
      fail-fast: false
      matrix:
        flavour: [remotesigner, remotesigner-consensus]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and run the smoke test
        run: make docker-smoke FLAVOUR=${{ matrix.flavour }} GO_LICENSES="$(go env GOPATH)/bin/go-licenses"

  systemd-smoke:
    # deploy/systemd/remotesigner.service with deploy/config/single-host.yaml,
    # installed as the systemd guide describes, in a privileged container
    # that runs systemd: the hardened unit serves TLS, reloads and stops.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run the unit under systemd
        run: make systemd-smoke
